name: GitOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Login DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate Version
      run: |
        VERSION="1.0.${{ github.run_number }}-${GITHUB_SHA::7}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:$VERSION .

    - name: Push Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:$VERSION

    # 🔥 CONNECT TO GITOPS REPO
    - name: Clone GitOps Repo
      run: |
        git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/YOUR_USERNAME/gitops-repo.git

    - name: Install yq
      run: sudo snap install yq

    - name: Update Image Tag in GitOps Repo
      run: |
        cd gitops-repo/flask
        yq -i '.image.tag = strenv(VERSION)' values.yaml

    - name: Commit & Push
      run: |
        cd gitops-repo
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .
        git commit -m "Update image to $VERSION" || echo "No change"
        git push