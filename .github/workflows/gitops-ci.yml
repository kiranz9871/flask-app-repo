name: GitOps CI Pipeline

on:
  push:
    branches:
      - main
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Login DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate Version
      run: |
        VERSION="1.0.${{ github.run_number }}-${GITHUB_SHA::7}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:$VERSION .

    - name: Push Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:$VERSION

    # 🔥 CONNECT TO GITOPS REPO
    - name: Clone GitOps Repo
      run: |
        git clone 'https://kiran9871:${{ secrets.GITOPS_TOKEN }}@github.com/kiranz9871/flask-gitops-repo.git' gitops-repo

    - name: Install yq
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
        sudo chmod +x /usr/bin/yq

    - name: Update Image Tag in GitOps Repo
      working-directory: gitops-repo/flask
      run: |
        echo "VERSION is $VERSION"
        yq -i ".image.tag = \"$VERSION\"" values.yaml
        echo "After update:"
        cat values.yaml

    - name: Commit & Push
      working-directory: gitops-repo        # <--- Keeps you in the right folder for this step
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .
        git commit -m "Update image to $VERSION" || echo "No change"
        git push